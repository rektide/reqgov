[package]
name = "reqgov"
version = "0.1.0"
edition = "2021"
description = "Multi-timebase HTTP API rate limiting middleware for reqwest - supports IETF draft, GitHub, and GitLab"
license = "MIT"
repository = "https://github.com/rektide/reqgov"

[lib]
name = "reqgov"
path = "src/lib.rs"

[dependencies]
arc-swap = "1.8.0"
async-trait = "0.1"
base64 = "0.22"
dashmap = "6.1.0"
governor = "0.10"
http = "1.1"
reqwest-middleware = "0.5"
reqwest-ratelimit = "0.5"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }



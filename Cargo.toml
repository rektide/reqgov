[package]
name = "reqgov"
version = "0.1.0"
edition = "2021"
description = "Multi-timebase HTTP API rate limiting middleware for reqwest - supports IETF draft, GitHub, and GitLab"
license = "MIT"
repository = "https://github.com/rektide/reqgov"

[lib]
name = "reqgov"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
governor = "0.10"
http = "1.1"
reqwest-ratelimit = "0.5"
tokio = { version = "1", features = ["sync"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }


